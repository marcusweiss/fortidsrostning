name: Uppdatera förtidsröster

on:
  schedule:
    # Valmyndigheten uppdaterar ca 06 och 14 svensk tid.
    # GitHub Actions kan försenas – kör därför varje timme runt dessa tider (UTC).
    - cron: "15 4,5,6,7,8,12,13,14,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta och bearbeta CSV
        run: python scripts/update_data.py

      - name: Commita om data ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Ingen ändring i data.json"
          else
            git commit -m "Uppdatera förtidsröster $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
