name: Uppdatera förtidsröster

on:
  schedule:
    # Valmyndigheten uppdaterar kl 06 och 14 – kör strax efter
    - cron: "30 4,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Hämta och bearbeta CSV
        run: python scripts/update_data.py

      - name: Commita om data ändrats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "Ingen ändring i data.json"
          else
            git commit -m "Uppdatera förtidsröster $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
